<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="BrowserSmith">
  <title>BrowserSmith — turn your ChatGPT account into a local software factory</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#0A1A24"/>
      <stop offset="1" stop-color="#08131C"/>
    </linearGradient>
    <linearGradient id="tealsky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0FA98C"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EDF3"/>
    </linearGradient>
    <linearGradient id="plate" x1="0.12" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#0FA98C"/>
      <stop offset="0.42" stop-color="#0B8A85"/>
      <stop offset="1" stop-color="#0E3350"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="990" cy="300" r="330" fill="url(#halo)"/>

  <!-- Icon lockup -->
  <g transform="translate(96 152) scale(0.46)">
    <rect width="512" height="512" rx="116" fill="url(#plate)"/>
    <g fill="url(#mark)">
      <path fill-rule="evenodd" d="
        M150 116 h212 a44 44 0 0 1 44 44 v192 a44 44 0 0 1 -44 44 h-212
        a44 44 0 0 1 -44 -44 v-192 a44 44 0 0 1 44 -44 z
        M146 186 v166 a18 18 0 0 0 18 18 h184 a18 18 0 0 0 18 -18 v-166 z"/>
      <circle cx="176" cy="152" r="13"/><circle cx="216" cy="152" r="13"/><circle cx="256" cy="152" r="13"/>
      <path d="M168 316 h176 a8 8 0 0 1 8 8 v14 a8 8 0 0 1 -8 8 h-14
        c6 18 18 30 30 36 a6 6 0 0 1 -3 11 h-88 a6 6 0 0 1 -3 -11
        c12 -6 24 -18 30 -36 h-14 a8 8 0 0 1 -8 -8 v-14 a8 8 0 0 1 8 -8 z"/>
      <g transform="rotate(38 300 250)">
        <path d="M262 196 h74 a16 16 0 0 1 16 16 v34 a16 16 0 0 1 -16 16 h-74
                 c-10 0 -16 -8 -20 -18 -4 -12 -4 -18 0 -30 4 -10 10 -18 20 -18 z"/>
        <rect x="336" y="214" width="112" height="26" rx="13"/>
      </g>
      <path d="M258 236 l13 40 32 -22 -20 34 40 8 -40 8 20 34 -32 -22 -13 40
        -13 -40 -32 22 20 -34 -40 -8 40 -8 -20 -34 32 22 z"/>
    </g>
  </g>

  <!-- Wordmark and pitch -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="392" y="252" font-size="86" font-weight="800" fill="#F8FAFC" letter-spacing="-2">Browser<tspan fill="url(#tealsky)">Smith</tspan></text>
    <text x="396" y="312" font-size="31" font-weight="500" fill="#94A3B8">Turn your ChatGPT account into a local software factory.</text>

    <!-- The four roles, as the product's actual shape -->
    <g font-size="21" font-weight="600">
      <g transform="translate(396 372)">
        <rect width="176" height="46" rx="12" fill="#0F1B2A" stroke="#1E3A4A"/>
        <circle cx="26" cy="23" r="6" fill="#34D399"/>
        <text x="46" y="30" fill="#CBD5E1">plans</text>
      </g>
      <g transform="translate(588 372)">
        <rect width="176" height="46" rx="12" fill="#0F1B2A" stroke="#1E3A4A"/>
        <circle cx="26" cy="23" r="6" fill="#22D3EE"/>
        <text x="46" y="30" fill="#CBD5E1">writes</text>
      </g>
      <g transform="translate(780 372)">
        <rect width="176" height="46" rx="12" fill="#0F1B2A" stroke="#1E3A4A"/>
        <circle cx="26" cy="23" r="6" fill="#38BDF8"/>
        <text x="46" y="30" fill="#CBD5E1">reviews</text>
      </g>
      <g transform="translate(972 372)">
        <rect width="176" height="46" rx="12" fill="#0F1B2A" stroke="#1E3A4A"/>
        <circle cx="26" cy="23" r="6" fill="#818CF8"/>
        <text x="46" y="30" fill="#CBD5E1">runs it</text>
      </g>
    </g>

    <text x="396" y="486" font-size="25" font-weight="600" fill="#5EEAD4">No API keys. No tokens. Four browser tabs.</text>
    <text x="396" y="530" font-size="20" fill="#64748B">Next.js · Vite · Python · Go · Rust · Node · static — it detects and runs whatever it writes.</text>
  </g>
</svg>
