<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="BrowserSmith">
  <title>BrowserSmith (small sizes)</title>

  <!--
    The 16-48px variant. The full mark carries a browser frame, an anvil, a
    hammer and a spark; below ~64px those four shapes collapse into noise. This
    keeps only what survives: a heavy frame and one bold strike inside it.
    Same palette and silhouette family, so it reads as the same product.
  -->
  <defs>
    <linearGradient id="bs-plate-s" x1="0.12" y1="0" x2="0.85" y2="1">
      <stop offset="0"    stop-color="#0FA98C"/>
      <stop offset="0.42" stop-color="#0B8A85"/>
      <stop offset="1"    stop-color="#0E3350"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bs-plate-s)"/>

  <g fill="#FFFFFF">
    <!-- Heavier walls and a taller top bar: both survive downsampling. -->
    <path fill-rule="evenodd" d="
      M118 92 h276 a48 48 0 0 1 48 48 v232 a48 48 0 0 1 -48 48 h-276
      a48 48 0 0 1 -48 -48 v-232 a48 48 0 0 1 48 -48 z
      M118 186 v186 a12 12 0 0 0 12 12 h252 a12 12 0 0 0 12 -12 v-186 z"/>
    <circle cx="152" cy="139" r="15"/>
    <circle cx="200" cy="139" r="15"/>
    <circle cx="248" cy="139" r="15"/>

    <!-- One bold hammer, filling the window. No anvil, no sparks: at 16px they
         only ever became grey pixels. -->
    <g transform="rotate(45 256 285)">
      <path d="M180 236 h86 a20 20 0 0 1 20 20 v40 a20 20 0 0 1 -20 20 h-86
               c-13 0 -20 -10 -24 -21 -5 -14 -5 -24 0 -38 4 -11 11 -21 24 -21 z"/>
      <rect x="286" y="258" width="118" height="36" rx="18"/>
    </g>
  </g>
</svg>
