<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="BrowserSmith">
  <title>BrowserSmith</title>

  <defs>
    <!-- Emerald at the top-left cooling to deep navy at the bottom-right:
         the forge glow fading into the dark of the workshop. -->
    <linearGradient id="bs-plate" x1="0.12" y1="0" x2="0.85" y2="1">
      <stop offset="0"    stop-color="#0FA98C"/>
      <stop offset="0.42" stop-color="#0B8A85"/>
      <stop offset="1"    stop-color="#0E3350"/>
    </linearGradient>

    <!-- One mark, drawn as a single white silhouette so it stays readable
         when the whole icon is 16px in a taskbar. -->
    <linearGradient id="bs-mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF2F4"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bs-plate)"/>

  <g fill="url(#bs-mark)">
    <!-- Browser chrome: the frame the work happens inside. Drawn with
         even-odd so the window is an outline, not a filled slab. -->
    <path fill-rule="evenodd" d="
      M150 116 h212 a44 44 0 0 1 44 44 v192 a44 44 0 0 1 -44 44 h-212
      a44 44 0 0 1 -44 -44 v-192 a44 44 0 0 1 44 -44 z
      M146 186 v166 a18 18 0 0 0 18 18 h184 a18 18 0 0 0 18 -18 v-166 z"/>
    <circle cx="176" cy="152" r="13"/>
    <circle cx="216" cy="152" r="13"/>
    <circle cx="256" cy="152" r="13"/>

    <!-- Anvil: horn left, waist, splayed feet. -->
    <path d="
      M168 316 h176 a8 8 0 0 1 8 8 v14 a8 8 0 0 1 -8 8 h-14
      c6 18 18 30 30 36 a6 6 0 0 1 -3 11 h-88 a6 6 0 0 1 -3 -11
      c12 -6 24 -18 30 -36 h-14 a8 8 0 0 1 -8 -8 v-14 a8 8 0 0 1 8 -8 z"/>

    <!-- Claw hammer, mid-swing. -->
    <g transform="rotate(38 300 250)">
      <path d="M262 196 h74 a16 16 0 0 1 16 16 v34 a16 16 0 0 1 -16 16 h-74
               c-10 0 -16 -8 -20 -18 -4 -12 -4 -18 0 -30 4 -10 10 -18 20 -18 z"/>
      <rect x="336" y="214" width="112" height="26" rx="13"/>
    </g>

    <!-- The strike: an eight-point burst where hammer meets anvil. -->
    <path d="
      M258 236 l13 40 32 -22 -20 34 40 8 -40 8 20 34 -32 -22 -13 40
      -13 -40 -32 22 20 -34 -40 -8 40 -8 -20 -34 32 22 z"/>
  </g>
</svg>
