name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "test (node ${{ matrix.node }}, ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` first because a green run should mean the committed lockfile
      # installs; `npm install` as the fallback so a lockfile that has drifted
      # from the manifest does not mask a real test failure behind an install
      # error. The toolchain tests load src/main/toolchain.js, which requires
      # electron at module scope, so the dependencies genuinely have to be here.
      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      # Not `npm test`: bare `node --test` discovers test files on every
      # supported Node version, and it keeps this job independent of whatever
      # the test script happens to be.
      - name: Test
        run: node --test

      # The main process, the preloads and the toolchain cannot be imported
      # outside Electron, and they hold the platform branches that differ
      # between Windows and everything else. Parsing every file on both
      # operating systems is the cheapest guard against a syntax error shipping.
      - name: Syntax-check every source file
        shell: bash
        run: |
          set -e
          for f in $(find src tools -name '*.js'); do
            node --check "$f"
          done
